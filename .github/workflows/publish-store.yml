name: Publish to ConjureOS App Store

# Builds the recipes anchor app to a single self-contained HTML file and
# publishes a new App Store version via the shared composite action in the
# conjureos monorepo.
#
# Two Supabase projects (Phase 24 split), selected by trigger:
#   - workflow_dispatch  -> DEV  project (test against dev.conjureos.pages.dev)
#   - release published  -> PROD project (ships to real users)
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   Dev:   SUPABASE_DEV_URL  SUPABASE_DEV_ANON_KEY
#          PUBLISH_BOT_DEV_EMAIL  PUBLISH_BOT_DEV_PASSWORD
#   Prod:  SUPABASE_PROD_URL SUPABASE_PROD_ANON_KEY
#          PUBLISH_BOT_PROD_EMAIL PUBLISH_BOT_PROD_PASSWORD
# See ANCHOR_APP_CI_SETUP.md in the conjureos repo for the one-time setup.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      changelog:
        description: Changelog for this version
        required: false
        default: ""

concurrency:
  group: publish-store-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build single-file HTML
        run: npm run build:inline

      - name: Resolve changelog
        id: changelog
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            text="${{ github.event.release.body }}"
            [ -z "$text" ] && text="${{ github.event.release.name }}"
            [ -z "$text" ] && text="${{ github.event.release.tag_name }}"
          else
            text="${{ github.event.inputs.changelog }}"
          fi
          # Pass through a delimited heredoc so multi-line release notes survive.
          {
            echo "text<<__CHANGELOG__"
            echo "$text"
            echo "__CHANGELOG__"
          } >> "$GITHUB_OUTPUT"

      # The action lives on the conjureos `dev` branch. Until this pipeline is
      # merged to dev, pin both steps to the feature branch you're testing on,
      # e.g. @claude/conjureos-anchor-app-ci-s6pLw.

      # workflow_dispatch -> DEV project. Test path; publishes to dev users.
      - name: Publish to App Store (dev)
        if: github.event_name == 'workflow_dispatch'
        uses: Jonny-B/ConjureOS/.github/actions/publish-anchor-app@claude/conjureos-anchor-app-ci-s6pLw
        with:
          supabase-url: ${{ secrets.SUPABASE_DEV_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
          bot-email: ${{ secrets.PUBLISH_BOT_DEV_EMAIL }}
          bot-password: ${{ secrets.PUBLISH_BOT_DEV_PASSWORD }}
          html-path: dist/index.html
          slug: recipes
          changelog: ${{ steps.changelog.outputs.text }}

      # release published -> PROD project. Ships to real users.
      - name: Publish to App Store (prod)
        if: github.event_name == 'release'
        uses: Jonny-B/ConjureOS/.github/actions/publish-anchor-app@claude/conjureos-anchor-app-ci-s6pLw
        with:
          supabase-url: ${{ secrets.SUPABASE_PROD_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
          bot-email: ${{ secrets.PUBLISH_BOT_PROD_EMAIL }}
          bot-password: ${{ secrets.PUBLISH_BOT_PROD_PASSWORD }}
          html-path: dist/index.html
          slug: recipes
          changelog: ${{ steps.changelog.outputs.text }}
