name: Publish to ConjureOS App Store

# This app is pure source (no Vite). ConjureOS's own bundler (@bundle, inside
# the shared composite action) builds it into a single store HTML — exactly the
# pipeline a user-imported store app goes through.
#
# Two Supabase projects (Phase 24 split), selected by trigger:
#   - workflow_dispatch  -> DEV  project (test against dev.conjureos.pages.dev)
#   - release published  -> PROD project (ships to real users)
#
# Only secret you must add per repo is the bot password (dev + prod) and a
# read-only PAT for ConjureOS (CONJUREOS_REPO_TOKEN). URL is derived from the
# existing SUPABASE_DEV/PROD_PROJECT_REF secrets; anon key + bot email are
# public/non-secret and inlined below. See ANCHOR_APP_CI_SETUP.md.

on:
  release:
    types: [published]
  # A semver tag push (v1.2.3) publishes to PROD — same effect as a release.
  # A push to a publish/** branch also publishes to PROD; a push to publish-dev/**
  # publishes to DEV. These are "publish buttons" for environments where
  # releases/tags/dispatch aren't available to automation but branch pushes are.
  # Normal dev/main merges are unaffected.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - "publish/**"
      - "publish-dev/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Which App Store to publish to
        type: choice
        options: [dev, prod]
        default: dev
      changelog:
        description: Changelog for this version
        required: false
        default: ""

concurrency:
  group: publish-store-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Resolve changelog
        id: changelog
        # User-controlled fields (release body/name, dispatch changelog) come in
        # as env vars, NOT inlined via ${{ }} into the script body. Inlining lets
        # a quote or backtick in the release notes break the shell (a release
        # body containing "I made this" once failed the job with
        # `made: command not found`). Reading them as $ENV is injection-safe.
        env:
          REL_BODY: ${{ github.event.release.body }}
          REL_NAME: ${{ github.event.release.name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            text="$REL_BODY"
            [ -z "$text" ] && text="$REL_NAME"
            [ -z "$text" ] && text="$REL_TAG"
          else
            text="$DISPATCH_CHANGELOG"
          fi
          # Tag-push (and empty dispatch) fall back to the ref name (e.g. v0.7.0).
          [ -z "$text" ] && text="${{ github.ref_name }}"
          {
            echo "text<<__CHANGELOG__"
            echo "$text"
            echo "__CHANGELOG__"
          } >> "$GITHUB_OUTPUT"

      # The shared publish/build action lives in the (private) ConjureOS repo.
      # GitHub can't resolve an action in another private *personal* repo via
      # `uses: Jonny-B/ConjureOS/...@dev`, so check ConjureOS out with a
      # read-only PAT and reference the action by local path below. ConjureOS's
      # @bundle build action + scripts/ + the @conjureos/pack bundler ride along.
      # Pinned to ConjureOS `dev`: the publish tooling (scripts/bundle-app.ts +
      # the shared @conjureos/pack bundler) is canonical and up-to-date on dev.
      # (Was briefly pinned to `main` as a workaround while dev's lib/bundle ->
      # @conjureos/pack migration left bundle-app.ts importing a deleted module,
      # which broke the build. Fixed in ConjureOS 0.8.5, so dev is correct again.
      # main's stale lib/bundle produced a broken ~1.8KB stub bundle — do NOT pin
      # back to main until that fix also reaches ConjureOS main.)
      - name: Checkout ConjureOS (shared publish action)
        uses: actions/checkout@v4
        with:
          repository: Jonny-B/ConjureOS
          ref: dev
          token: ${{ secrets.CONJUREOS_REPO_TOKEN }}
          path: .conjureos

      # The manifest's remoteActions.recipesDb.url (per-user DB reads/writes via
      # the minted-token flow) must point at the SAME project we're publishing
      # to. The committed default is dev; rewrite it from the per-env project-ref
      # secret so a prod release talks to the prod recipes-db, not dev. (Catalog
      # browse uses the kernel-injected env.recipesApiUrl, which is already
      # per-env, so only this static manifest URL needs stamping.)
      - name: Stamp recipes-db backend URL into manifest
        env:
          # Prod when a release fires, a semver tag is pushed, OR a manual run
          # picks the prod environment.
          IS_PROD: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/publish/') || github.event.inputs.environment == 'prod' }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            REF="${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
          else
            REF="${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
          fi
          export RECIPES_DB_URL="https://${REF}.supabase.co/functions/v1/recipes-db"
          node -e "const fs=require('fs');const p=require('./package.json');p.conjureos.remoteActions.recipesDb.url=process.env.RECIPES_DB_URL;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n');console.log('stamped recipesDb url ->',process.env.RECIPES_DB_URL);"

      # workflow_dispatch (environment=dev) or a publish-dev/** push -> DEV project.
      - name: Publish to App Store (dev)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'prod') || startsWith(github.ref, 'refs/heads/publish-dev/')
        uses: ./.conjureos/.github/actions/publish-anchor-app
        with:
          supabase-url: https://${{ secrets.SUPABASE_DEV_PROJECT_REF }}.supabase.co
          # Anon key is public by design (shipped in every browser); RLS applies.
          supabase-anon-key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xcHZqbHN5d3JwdGVmZ3d1enRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTA3OTMsImV4cCI6MjA5NTQ4Njc5M30.ITZjX5KkMNgbJuFEHS5-IqFFJC6A39OynVgOznZeqD8
          bot-email: conjureosbot@gmail.com
          bot-password: ${{ secrets.PUBLISH_BOT_DEV_PASSWORD }}
          source-path: .
          project-name: Recipes
          slug: recipes
          changelog: ${{ steps.changelog.outputs.text }}

      # release published, or a manual run with environment=prod -> PROD project.
      # Ships to real users.
      - name: Publish to App Store (prod)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/publish/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
        uses: ./.conjureos/.github/actions/publish-anchor-app
        with:
          supabase-url: https://${{ secrets.SUPABASE_PROD_PROJECT_REF }}.supabase.co
          supabase-anon-key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50Z2VsYnRlcGVjcXNxbG94bWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTkzMzEsImV4cCI6MjA5MzY3NTMzMX0.fgRCszkeAbHANaK-JJAGmTwWHyOh-3b6-od1c3s3V0w
          bot-email: conjureosbot@gmail.com
          bot-password: ${{ secrets.PUBLISH_BOT_PROD_PASSWORD }}
          source-path: .
          project-name: Recipes
          slug: recipes
          changelog: ${{ steps.changelog.outputs.text }}
